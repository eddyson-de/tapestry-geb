plugins {
  id "java"
  id "groovy"
  id "maven-publish"
}

description = "Utilities for Geb-based browser tests of Tapestry applications"

group = "de.eddyson"
version = "0.49.2"

repositories {
  mavenCentral()
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17

  withSourcesJar()
}

ext.versions = [
  tapestry: '5.9.0',
  jetty: '12.0.25'
]

configurations.configureEach {
  resolutionStrategy {
    force 'org.codehaus.groovy:groovy:3.0.25'
    force 'org.codehaus.groovy:groovy-bom:3.0.25'
    force 'org.codehaus.groovy:groovy-all:3.0.25'
  }
}

dependencies {
  implementation "org.apache.tapestry:tapestry-core-jakarta:$versions.tapestry"
  implementation "org.eclipse.jetty:jetty-server:$versions.jetty"
  implementation "org.eclipse.jetty.ee10:jetty-ee10-webapp:$versions.jetty" // servlet 6.x
  implementation "org.gebish:geb-spock:6.0"
  implementation "org.seleniumhq.selenium:selenium-support:4.30.0"

  testImplementation "org.seleniumhq.selenium:selenium-chrome-driver:4.30.0"
  testImplementation "org.tynamo:tapestry-resteasy:1.0.0"
}

test {
  useJUnitPlatform()

  systemProperty "webappLocation", "src/test/webapp/"
  systemProperty "jettyPort", "40258"
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }
}
